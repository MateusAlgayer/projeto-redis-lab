# Configuração HTTP da aplicação
quarkus.http.port=8080

# Configuração do cliente Redis (para ambiente de produção; em dev/test o DevServices sobe automaticamente)
%prod.quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.client-type=standalone
quarkus.redis.timeout=10s

# Configuração do OpenAPI e Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=API de Gerenciamento de Promoções (Redis Lab)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST para criação, consulta e gerenciamento do ciclo de vida de promoções com expiração automática utilizando Redis.
quarkus.smallrye-openapi.info-contact-name=Equipe de Engenharia
quarkus.smallrye-openapi.info-contact-email=engenharia@acme.org

# Habilitar Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Níveis de log
quarkus.log.level=INFO
quarkus.log.category."org.acme".level=DEBUG
